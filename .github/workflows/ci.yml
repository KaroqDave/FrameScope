name: CI

# Releases: push a tag "vX.Y.Z[-suffix]", or a branch "release/vX.Y.Z[-suffix]";
# the release job then creates the tag itself.
on:
  push:
    branches: [main, "release/**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    name: Linux (GCC, Qt 6)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      # Qt and Ninja come from the Ubuntu package mirror, which is sometimes
      # unreachable from the runners. Then the GUI is skipped: core, CLI and all
      # tests still build and run with the preinstalled compiler.
      - name: Install Qt
        id: deps
        timeout-minutes: 10
        run: |
          apt_get() { sudo timeout "$1" apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=20 -o DPkg::Lock::Timeout=60 "${@:2}"; }
          if apt_get 120 update && apt_get 300 install -y --no-install-recommends qt6-base-dev ninja-build; then
            echo "gui=ON" >> "$GITHUB_OUTPUT"
            echo "generator=Ninja" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Ubuntu package mirror not reachable: building without the Qt GUI in this run"
            echo "gui=OFF" >> "$GITHUB_OUTPUT"
            echo "generator=Unix Makefiles" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure
        run: cmake -S . -B build -G "${{ steps.deps.outputs.generator }}" -DCMAKE_BUILD_TYPE=Release -DFRAMESCOPE_BUILD_GUI=${{ steps.deps.outputs.gui }}

      - name: Build
        run: cmake --build build --parallel 4

      - name: Test
        run: ctest --test-dir build --output-on-failure

  windows:
    # Two packages: the regular one, and one with AMD GPU sensors (ADLX), which
    # AMD's license only allows to ship together with EULA-AMD.txt.
    name: Windows ${{ matrix.variant }} (MSVC, Qt 6)
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: standard
            adlx: "OFF"
            package: FrameScope
          - variant: AMD
            adlx: "ON"
            package: FrameScope-AMD
    steps:
      - uses: actions/checkout@v5

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.*"
          arch: win64_msvc2022_64
          cache: true

      - name: Version label
        shell: pwsh
        run: |
          $ref = "${{ github.ref }}"
          $tag = ""
          if ("${{ github.ref_type }}" -eq "tag") { $tag = "${{ github.ref_name }}" }
          elseif ($ref.StartsWith("refs/heads/release/")) { $tag = $ref.Substring("refs/heads/release/".Length) }
          $label = if ($tag) { $tag } else { "0.1.0-dev+$("${{ github.sha }}".Substring(0, 7))" }
          "VERSION_LABEL=$label" >> $env:GITHUB_ENV
          "RELEASE_TAG=$tag" >> $env:GITHUB_ENV

      # Errors are repeated as annotations so they show up on the commit's checks.
      - name: Configure
        shell: pwsh
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DFRAMESCOPE_WITH_ADLX=${{ matrix.adlx }} "-DFRAMESCOPE_VERSION_LABEL=$env:VERSION_LABEL" 2>&1 | Tee-Object configure.log
          if ($LASTEXITCODE) {
            Select-String -Path configure.log -Pattern 'Error|error' | Select-Object -First 15 | ForEach-Object { "::error::$($_.Line.Trim())" }
            exit 1
          }

      - name: Build
        shell: pwsh
        run: |
          cmake --build build -- -k 0 2>&1 | Tee-Object build.log
          if ($LASTEXITCODE) {
            Select-String -Path build.log -Pattern ': error |: fatal error |FAILED:' | Select-Object -First 25 | ForEach-Object { "::error::$($_.Line.Trim())" }
            exit 1
          }

      - name: Test
        shell: pwsh
        run: |
          ctest --test-dir build --output-on-failure 2>&1 | Tee-Object test.log
          if ($LASTEXITCODE) {
            Select-String -Path test.log -Pattern 'FAIL' | Select-Object -First 25 | ForEach-Object { "::error::$($_.Line.Trim())" }
            exit 1
          }

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item build/framescope.exe, build/framescope-cli.exe, build/framescope-latency.exe dist/
          Copy-Item README.md, LICENSE, packaging/THIRD-PARTY-NOTICES.txt dist/
          if ("${{ matrix.adlx }}" -eq "ON") { Copy-Item packaging/EULA-AMD.txt dist/ }
          windeployqt --release --no-translations --no-opengl-sw --no-system-d3d-compiler dist/framescope.exe

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.package }}-windows-x64
          path: dist/

      - name: Zip for release
        if: env.RELEASE_TAG != ''
        shell: pwsh
        run: Compress-Archive -Path dist/* -DestinationPath "${{ matrix.package }}-$env:RELEASE_TAG-windows-x64.zip"

      - name: Upload zip for release
        if: env.RELEASE_TAG != ''
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.variant }}
          path: ${{ matrix.package }}-*-windows-x64.zip

  release:
    name: GitHub release
    if: github.ref_type == 'tag' || startsWith(github.ref, 'refs/heads/release/')
    needs: [linux, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Release tag
        id: tag
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then tag="${GITHUB_REF_NAME}"; else tag="${GITHUB_REF_NAME#release/}"; fi
          echo "name=$tag" >> "$GITHUB_OUTPUT"
          case "$tag" in *-*) echo "prerelease=true" >> "$GITHUB_OUTPUT";; *) echo "prerelease=false" >> "$GITHUB_OUTPUT";; esac

      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          target_commitish: ${{ github.sha }}
          name: FrameScope ${{ steps.tag.outputs.name }}
          files: "*-windows-x64.zip"
          body_path: packaging/RELEASE_NOTES.md
          prerelease: ${{ steps.tag.outputs.prerelease }}
          generate_release_notes: true
