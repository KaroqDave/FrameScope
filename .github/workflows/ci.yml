name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    name: Linux (GCC, Qt 6)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y qt6-base-dev ninja-build

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

  windows:
    name: Windows (MSVC, Qt 6)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.*"
          arch: win64_msvc2022_64
          cache: true

      # Errors are repeated as annotations so they show up on the commit's checks.
      - name: Configure
        shell: pwsh
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release 2>&1 | Tee-Object configure.log
          if ($LASTEXITCODE) {
            Select-String -Path configure.log -Pattern 'Error|error' | Select-Object -First 15 | ForEach-Object { "::error::$($_.Line.Trim())" }
            exit 1
          }

      - name: Build
        shell: pwsh
        run: |
          cmake --build build -- -k 0 2>&1 | Tee-Object build.log
          if ($LASTEXITCODE) {
            Select-String -Path build.log -Pattern ': error |: fatal error |FAILED:' | Select-Object -First 25 | ForEach-Object { "::error::$($_.Line.Trim())" }
            exit 1
          }

      - name: Test
        shell: pwsh
        run: |
          ctest --test-dir build --output-on-failure 2>&1 | Tee-Object test.log
          if ($LASTEXITCODE) {
            Select-String -Path test.log -Pattern 'FAIL' | Select-Object -First 25 | ForEach-Object { "::error::$($_.Line.Trim())" }
            exit 1
          }

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item build/framescope.exe, build/framescope-cli.exe, build/framescope-latency.exe dist/
          Copy-Item README.md dist/
          windeployqt --release --no-translations --no-opengl-sw --no-system-d3d-compiler dist/framescope.exe

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: FrameScope-windows-x64
          path: dist/

      - name: Zip for release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: Compress-Archive -Path dist/* -DestinationPath FrameScope-${{ github.ref_name }}-windows-x64.zip

      - name: Upload artifact for release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: release-zip
          path: FrameScope-*-windows-x64.zip

  release:
    name: GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-zip

      - uses: softprops/action-gh-release@v2
        with:
          files: FrameScope-*-windows-x64.zip
          generate_release_notes: true
